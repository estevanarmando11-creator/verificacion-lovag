<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifica WhatsApp</title>
<meta name="theme-color" content="#18bd62">
<style>
*{box-sizing:border-box}body{margin:0;background:#08121d;color:#eaf2f7;font-family:Arial,sans-serif}
.wrap{max-width:480px;margin:auto;padding:18px}.brand{font-size:24px;font-weight:800;margin:8px 0 20px}
.brand span{color:#18bd62}.card{background:#f7f9fa;color:#17202a;border-radius:14px;padding:18px;margin:12px 0}
label{display:block;font-weight:700;margin-top:10px}input,select,textarea{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #ccd5dc;border-radius:9px;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:9px;font-weight:700;margin:6px 0;cursor:pointer}
.primary{background:#18bd62;color:#fff}.secondary{background:#233547;color:#fff}.hidden{display:none}
.ok,.warn,.bad{padding:15px;border-radius:10px;text-align:center;font-weight:800}.ok{background:#dff7e9;color:#087b3c}.warn{background:#fff0c9;color:#8b6500}.bad{background:#ffdede;color:#b51616}
.report{border-top:1px solid #ddd;padding:12px 0}.muted{color:#71808d;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">VERIFICA <span>WHATSAPP</span></div>

<section id="login" class="card">
<h2>Iniciar sesión</h2>
<label for="loginUser">Usuario</label>
<input id="loginUser" value="empleado" autocomplete="username">
<label for="loginPass">Contraseña</label>
<input id="loginPass" type="password" value="1234" autocomplete="current-password">
<button id="loginBtn" class="primary">INGRESAR</button>
<p class="muted">Demo: empleado / 1234 · administrador: admin / admin123</p>
</section>

<section id="app" class="hidden">
<div class="card"><div id="welcome"></div></div>

<div class="card">
<h2>🔎 Verificar contacto</h2>
<label for="phone">Número de WhatsApp</label>
<input id="phone" placeholder="+57 300 123 4567">
<label for="waUser">Usuario de WhatsApp</label>
<input id="waUser" placeholder="@usuario">
<button id="checkBtn" class="primary">CONSULTAR</button>
<div id="result" aria-live="polite"></div>
</div>

<div class="card">
<h2>📝 Registrar reporte</h2>
<label for="rPhone">Número</label>
<input id="rPhone" placeholder="+57 300 123 4567">
<label for="rUser">Usuario</label>
<input id="rUser" placeholder="@usuario">
<label for="reason">Motivo</label>
<select id="reason">
<option>Información falsa</option>
<option>Grosero / irrespetuoso</option>
<option>No cumplió</option>
<option>No se presentó</option>
<option>Problemas de pago</option>
<option>Comportamiento inapropiado</option>
<option>Posible estafa</option>
<option>Otro</option>
</select>
<label for="description">Descripción</label>
<textarea id="description" rows="4" placeholder="Describe hechos concretos y verificables..."></textarea>
<button id="saveBtn" class="primary">GUARDAR REPORTE</button>
</div>

<div class="card">
<button id="historyBtn" class="secondary">📋 HISTORIAL</button>
<button id="linkBtn" class="secondary">🔗 VINCULAR NÚMERO + @USUARIO</button>
<div id="adminOnly" class="hidden"></div>
</div>
</section>
</div>

<script>
const state={reports:[],links:[],history:[],user:null};

function np(s){return (s||'').replace(/\D/g,'').replace(/^57/,'');}
function nu(s){return (s||'').trim().replace(/^@/,'').toLowerCase();}
function now(){return new Date().toLocaleString('es-CO');}

function login(){
 const u=document.getElementById('loginUser').value.trim();
 const p=document.getElementById('loginPass').value;
 if((u==='empleado'&&p==='1234')||(u==='admin'&&p==='admin123')){
   state.user={name:u==='admin'?'Administrador':'Empleado Demo',role:u==='admin'?'admin':'employee'};
   document.getElementById('login').classList.add('hidden');
   document.getElementById('app').classList.remove('hidden');
   document.getElementById('welcome').textContent='Sesión: '+state.user.name;
 }else alert('Usuario o contraseña incorrectos.');
}

function linkedIds(p,u){
 let ids=[p,u].filter(Boolean);
 state.links.forEach(pair=>{
   if(pair.includes(p)||pair.includes(u)) ids=ids.concat(pair);
 });
 return [...new Set(ids)];
}

function findReports(p,u){
 const ids=linkedIds(p,u);
 return state.reports.filter(r=>
   (r.phone && ids.includes(r.phone)) || (r.username && ids.includes(r.username))
 );
}

function check(){
 const p=np(document.getElementById('phone').value);
 const u=nu(document.getElementById('waUser').value);
 if(p.length<7 && u.length<2)return alert('Ingresa un número o un @usuario.');
 const rs=findReports(p,u);
 const cls=rs.length>=3?'bad':rs.length?'warn':'ok';
 const title=rs.length>=3?'🔴 CONTACTO REPORTADO':rs.length?'🟡 CON OBSERVACIONES':'🟢 SIN ANOTACIONES';
 let html='<div class="'+cls+'">'+title+'</div><p><b>Contacto</b><br>';
 if(p)html+='📱 '+p+'<br>';
 if(u)html+='👤 @'+u;
 html+='</p><p><b>Reportes vinculados:</b> '+rs.length+'</p>';
 rs.forEach((r,i)=>{html+='<div class="report"><b>'+r.reason+'</b><br>'+r.description+'<br><span class="muted">'+(r.phone?'📱 '+r.phone+' ':'')+(r.username?'👤 @'+r.username:'')+'<br>Registrado por '+r.user+' · '+r.date+'</span></div>';});
 if(!rs.length)html+='<p class="muted">No hay anotaciones para este contacto.</p>';
 document.getElementById('result').innerHTML=html;
 state.history.unshift({p,u,user:state.user.name,date:now()});
}

function saveReport(){
 const p=np(document.getElementById('rPhone').value);
 const u=nu(document.getElementById('rUser').value);
 const reason=document.getElementById('reason').value;
 const desc=document.getElementById('description').value.trim();
 if(p.length<7&&u.length<2)return alert('Ingresa un número o @usuario.');
 if(!desc)return alert('Escribe la descripción del hecho.');
 state.reports.unshift({phone:p,username:u,reason,description:desc,user:state.user.name,date:now()});
 alert('Reporte guardado correctamente.');
 document.getElementById('description').value='';
 document.getElementById('phone').value=p?'+'+p:'';
 document.getElementById('waUser').value=u?'@'+u:'';
 check();
}

function history(){
 if(!state.history.length)return alert('No hay consultas todavía.');
 alert(state.history.slice(0,20).map(x=>(x.p||'')+(x.u?' / @'+x.u:'')+' — '+x.date+' — '+x.user).join('\\n'));
}

function linkContact(){
 if(state.user.role!=='admin')return alert('Solo el administrador puede vincular contactos.');
 const p=np(prompt('Escribe el número de WhatsApp:')||'');
 const u=nu(prompt('Escribe el @usuario de WhatsApp:')||'');
 if(p.length<7||u.length<2)return alert('Debes ingresar un número y un @usuario.');
 state.links.push([p,u]);
 alert('Contacto vinculado: +'+p+' ↔ @'+u);
}

document.getElementById('loginBtn').addEventListener('click',login);
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
document.getElementById('checkBtn').addEventListener('click',check);
document.getElementById('saveBtn').addEventListener('click',saveReport);
document.getElementById('historyBtn').addEventListener('click',history);
document.getElementById('linkBtn').addEventListener('click',linkContact);
</script>
</body>
</html>
