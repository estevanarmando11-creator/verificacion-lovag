<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VERIFICACIÓN LOVAG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07121d;--card:#f7f8fa;--text:#17212b;--muted:#66727d;--green:#18bf62;--green2:#0ca653;--navy:#23384b;--danger:#d83a3a;--border:#dfe4e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}.wrap{width:min(100%,430px);margin:auto;padding:18px 12px 35px}.brand{color:#fff;font-weight:800;font-size:18px;letter-spacing:.3px;margin:0 0 14px 2px}.brand span{color:var(--green)}.card{background:var(--card);border-radius:14px;padding:14px;margin:9px 0;box-shadow:0 4px 18px #0002}.session{font-size:12px;color:#46515b;padding:9px 12px}h2{font-size:18px;margin:0 0 13px}label{display:block;font-size:12px;font-weight:700;margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:7px;background:#fff;padding:10px 11px;font-size:13px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--green)}textarea{min-height:72px;resize:vertical}button{border:0;border-radius:7px;padding:10px 12px;font-weight:800;font-size:11px;cursor:pointer;width:100%;margin-top:9px}.green{background:var(--green);color:#fff}.green:hover{background:var(--green2)}.navy{background:var(--navy);color:#fff}.status{padding:10px;border-radius:8px;margin-top:10px;font-size:12px;display:none}.ok{background:#e3f8ec;color:#126a39}.bad{background:#fde9e9;color:#9e2020}.result{border-top:1px solid var(--border);margin-top:10px;padding-top:10px;font-size:12px;display:none}.row{display:flex;justify-content:space-between;gap:10px;margin:5px 0}.hidden{display:none!important}.small{font-size:11px;color:var(--muted)}.topline{display:flex;justify-content:space-between;align-items:center}.logout{width:auto;margin:0;padding:7px 9px;background:#e8edf1;color:#34424d}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal .card{width:min(100%,430px);max-height:85vh;overflow:auto}.report{border:1px solid var(--border);border-radius:8px;padding:10px;margin:8px 0;background:#fff}.report .reason{font-weight:800}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#e8edf1;font-size:10px;margin-top:5px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center}.login .card{width:min(100%,390px)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#142635;color:#fff;padding:11px 15px;border-radius:9px;font-size:12px;display:none;z-index:20;max-width:90%;text-align:center}
</style></head><body>
<div id="loginView" class="login"><div class="card"><div class="brand">VERIFICA <span>WHATSAPP</span></div><h2>🔐 Iniciar sesión</h2><label>Correo</label><input id="email" type="email" placeholder="correo@ejemplo.com"><label>Contraseña</label><input id="password" type="password" placeholder="••••••••"><button class="green" onclick="login()">INGRESAR</button><div id="loginStatus" class="status"></div><p class="small">Usa el usuario creado en Supabase Authentication.</p></div></div>
<div id="appView" class="wrap hidden"><div class="topline"><div class="brand">VERIFICA <span>WHATSAPP</span></div><button class="logout" onclick="logout()">SALIR</button></div><div class="card session">Sesión: <b id="sessionName">Cargando...</b></div>
<div class="card"><h2>🔎 Verificar contacto</h2><label>Número de WhatsApp</label><input id="searchPhone" placeholder="+57 300 123 4567"><label>Usuario de WhatsApp</label><input id="searchUsername" placeholder="@usuario"><button class="green" onclick="searchContact()">CONSULTAR</button><div id="searchStatus" class="status"></div><div id="searchResult" class="result"></div></div>
<div class="card"><h2>📝 Registrar reporte</h2><label>Número</label><input id="reportPhone" placeholder="+57 300 123 4567"><label>Usuario</label><input id="reportUsername" placeholder="@usuario"><label>Motivo</label><select id="reason"><option>Información falsa</option><option>Número no corresponde</option><option>Usuario no corresponde</option><option>Incumplimiento</option><option>Estafa</option><option>Otro</option></select><label>Descripción</label><textarea id="description" placeholder="Describe hechos concretos y verificables..."></textarea><button class="green" onclick="saveReport()">GUARDAR REPORTE</button><div id="reportStatus" class="status"></div></div>
<div class="card"><button class="navy" onclick="showHistory()">📋 HISTORIAL</button><button class="navy" onclick="openLinkModal()">🔗 VINCULAR NÚMERO + @USUARIO</button></div></div>
<div id="historyModal" class="modal" onclick="closeOnBackdrop(event,'historyModal')"><div class="card"><div class="topline"><h2>📋 Historial</h2><button class="logout" onclick="closeModal('historyModal')">CERRAR</button></div><div id="historyList" class="small">Cargando...</div></div></div>
<div id="linkModal" class="modal" onclick="closeOnBackdrop(event,'linkModal')"><div class="card"><div class="topline"><h2>🔗 Vincular contacto</h2><button class="logout" onclick="closeModal('linkModal')">CERRAR</button></div><label>Número</label><input id="linkPhone" placeholder="+57 300 123 4567"><label>@Usuario</label><input id="linkUsername" placeholder="@usuario"><label>Nombre (opcional)</label><input id="linkName" placeholder="Nombre visible"><button class="green" onclick="linkContact()">GUARDAR VINCULACIÓN</button><div id="linkStatus" class="status"></div></div></div><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://aaakmoylfzkadlyzbs.supabase.co";
const SUPABASE_KEY="sb_publishable_K4-hEsNRtAB7SQ8Jo4zQkA_NaZNGUWx";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentUser=null,selectedContact=null;
function normPhone(v){return(v||"").replace(/[^\d+]/g,"").trim()}function normUser(v){v=(v||"").trim().toLowerCase();return v&&!v.startsWith("@")?"@"+v:v}function msg(el,t,c){el.textContent=t;el.className="status "+c;el.style.display="block"}function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2800)}function closeModal(id){document.getElementById(id).style.display="none"}function closeOnBackdrop(e,id){if(e.target.id===id)closeModal(id)}function openLinkModal(){document.getElementById("linkModal").style.display="flex"}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
async function login(){let email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||!password)return msg(document.getElementById("loginStatus"),"Completa correo y contraseña.","bad");let{data,error}=await db.auth.signInWithPassword({email,password});if(error)return msg(document.getElementById("loginStatus"),error.message,"bad");currentUser=data.user;await loadApp()}async function logout(){await db.auth.signOut();location.reload()}
async function loadApp(){document.getElementById("loginView").classList.add("hidden");document.getElementById("appView").classList.remove("hidden");let{data,error}=await db.from("profiles").select("full_name,username,role").eq("id",currentUser.id).maybeSingle();document.getElementById("sessionName").textContent=error?"Usuario":(data?.full_name||data?.username||"Usuario")}
async function searchContact(){let phone=normPhone(document.getElementById("searchPhone").value),username=normUser(document.getElementById("searchUsername").value),st=document.getElementById("searchStatus"),res=document.getElementById("searchResult");if(!phone&&!username)return msg(st,"Ingresa número, usuario o ambos.","bad");let q=db.from("contacts").select("id,phone,wa_username,display_name,created_at");if(phone)q=q.eq("phone",phone);else q=q.eq("wa_username",username);let{data,error}=await q.maybeSingle();if(error&&error.code!=="PGRST116")return msg(st,"No se pudo consultar: "+error.message,"bad");if(!data){selectedContact=null;res.style.display="none";return msg(st,"❌ No se encontró el contacto.","bad")}selectedContact=data;document.getElementById("reportPhone").value=data.phone||phone;document.getElementById("reportUsername").value=data.wa_username||username;msg(st,"✅ Contacto encontrado.","ok");let{data:reports}=await db.from("reports").select("id,reason,status,description,created_at").eq("contact_id",data.id).order("created_at",{ascending:false});res.innerHTML=`<div class="row"><b>Número</b><span>${esc(data.phone||"—")}</span></div><div class="row"><b>Usuario</b><span>${esc(data.wa_username||"—")}</span></div><div class="row"><b>Nombre</b><span>${esc(data.display_name||"—")}</span></div><div class="row"><b>Reportes</b><span>${reports?.length||0}</span></div>`;if(reports?.length)res.innerHTML+=reports.slice(0,3).map(r=>`<div class="report"><div class="reason">${esc(r.reason)}</div><div>${esc(r.description)}</div><span class="pill">${esc(r.status)}</span></div>`).join("");res.style.display="block"}
async function saveReport(){let phone=normPhone(document.getElementById("reportPhone").value),username=normUser(document.getElementById("reportUsername").value),reason=document.getElementById("reason").value,description=document.getElementById("description").value.trim(),st=document.getElementById("reportStatus");if(!phone||!username||!description)return msg(st,"Completa número, usuario y descripción.","bad");let contact=selectedContact;if(!contact||contact.phone!==phone||contact.wa_username!==username){let{data,error}=await db.from("contacts").select("id,phone,wa_username").eq("phone",phone).eq("wa_username",username).maybeSingle();if(error)return msg(st,error.message,"bad");contact=data}if(!contact)return msg(st,"Primero verifica o vincula el número y usuario.","bad");let{error}=await db.from("reports").insert({contact_id:contact.id,reason,description,status:"pendiente",created_by:currentUser.id});if(error)return msg(st,"No se pudo guardar: "+error.message,"bad");msg(st,"✅ Reporte guardado correctamente.","ok");document.getElementById("description").value="";toast("Reporte guardado")}
async function linkContact(){let phone=normPhone(document.getElementById("linkPhone").value),username=normUser(document.getElementById("linkUsername").value),name=document.getElementById("linkName").value.trim(),st=document.getElementById("linkStatus");if(!phone||!username)return msg(st,"Completa número y usuario.","bad");let{data:existing}=await db.from("contacts").select("id").eq("phone",phone).maybeSingle();let error;if(existing){({error}=await db.from("contacts").update({wa_username:username,display_name:name||null,updated_at:new Date().toISOString()}).eq("id",existing.id))}else{({error}=await db.from("contacts").insert({phone,wa_username:username,display_name:name||null}))}if(error)return msg(st,error.message,"bad");msg(st,"✅ Vinculación guardada.","ok");toast("Contacto vinculado")}
async function showHistory(){document.getElementById("historyModal").style.display="flex";let list=document.getElementById("historyList");list.textContent="Cargando...";let{data,error}=await db.from("reports").select("id,contact_id,reason,description,status,created_at").order("created_at",{ascending:false}).limit(100);if(error){list.textContent="Error: "+error.message;return}if(!data?.length){list.textContent="No hay reportes registrados.";return}let ids=[...new Set(data.map(x=>x.contact_id))];let{data:contacts}=await db.from("contacts").select("id,phone,wa_username,display_name").in("id",ids);let map=Object.fromEntries((contacts||[]).map(c=>[c.id,c]));list.innerHTML=data.map(r=>{let c=map[r.contact_id]||{};return`<div class="report"><div class="reason">${esc(r.reason)}</div><div><b>${esc(c.phone||"")}</b> ${esc(c.wa_username||"")}</div><div>${esc(r.description)}</div><span class="pill">${esc(r.status)} · ${new Date(r.created_at).toLocaleString("es-CO")}</span></div>`}).join("")}
(async()=>{let{data}=await db.auth.getSession();if(data.session){currentUser=data.session.user;await loadApp()}})();
</script></body></html>
