<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERIFICACION LOVAG</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#07111b;color:#17212b}
    .app{max-width:560px;margin:auto;min-height:100vh;padding:18px 14px 35px}
    header{color:#fff;text-align:center;padding:10px 0 16px}
    header h1{margin:0;font-size:25px;letter-spacing:.5px}
    header h1 span{color:#16c46a}
    .session{background:#f4f6f8;border-radius:12px;padding:11px 14px;margin-bottom:10px;font-size:13px}
    .card{background:#f7f8fa;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0003}
    h2{font-size:18px;margin:0 0 14px}
    label{display:block;font-weight:700;font-size:12px;margin:10px 0 6px}
    input,select,textarea{width:100%;border:1px solid #d8dde2;border-radius:8px;background:#fff;padding:11px;font-size:14px;outline:none}
    textarea{min-height:90px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:#16c46a}
    button{border:0;border-radius:8px;padding:12px;width:100%;font-weight:700;cursor:pointer}
    .green{background:#16c46a;color:#fff}.dark{background:#263b50;color:#fff}.red{background:#c93434;color:#fff}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .hidden{display:none!important}
    .result{margin-top:12px;padding:12px;border-radius:9px;background:#e9f8ef;border-left:4px solid #16c46a}
    .danger{background:#fff0f0;border-left-color:#d33}
    .muted{color:#66717b;font-size:12px}
    .report{background:#fff;border:1px solid #e1e5e8;border-radius:9px;padding:11px;margin:8px 0}
    .report strong{display:block;margin-bottom:4px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
    .topbar button{width:auto;padding:8px 11px}
    .badge{display:inline-block;background:#263b50;color:#fff;border-radius:20px;padding:4px 8px;font-size:11px}
    .linkbox{background:#eef3f7;border-radius:8px;padding:10px;margin-top:10px}
    .small{font-size:11px}
    .center{text-align:center}
    .error{color:#b21f2d;background:#ffe9eb;border-radius:8px;padding:10px;font-size:12px;margin-top:10px}
    .success{color:#08733b;background:#e5f8ed;border-radius:8px;padding:10px;font-size:12px;margin-top:10px}
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>VERIFICACION <span>LOVAG</span></h1>
  </header>

  <section id="loginCard" class="card">
    <h2>🔐 Iniciar sesión</h2>
    <label>Correo</label>
    <input id="loginEmail" type="email" placeholder="correo@ejemplo.com">
    <label>Contraseña</label>
    <input id="loginPassword" type="password" placeholder="Contraseña">
    <button class="green" onclick="login()">INGRESAR</button>
    <div id="loginMsg"></div>
  </section>

  <main id="mainApp" class="hidden">
    <div class="session">
      <div class="topbar">
        <span id="sessionText">Sesión</span>
        <button class="dark" onclick="logout()">SALIR</button>
      </div>
      <span id="roleBadge" class="badge">Empleado</span>
    </div>

    <section class="card">
      <h2>🔎 Verificar contacto</h2>
      <label>Número de WhatsApp</label>
      <input id="searchPhone" placeholder="+57 300 123 4567">
      <label>Usuario de WhatsApp</label>
      <input id="searchUsername" placeholder="@usuario">
      <button class="green" onclick="searchContact()">CONSULTAR</button>
      <div id="searchResult"></div>
    </section>

    <section class="card">
      <h2>📝 Registrar reporte</h2>
      <label>Número</label>
      <input id="reportPhone" placeholder="+57 300 123 4567">
      <label>Usuario</label>
      <input id="reportUsername" placeholder="@usuario">
      <label>Motivo</label>
      <select id="reason">
        <option>Información falsa</option>
        <option>Estafa</option>
        <option>Incumplimiento</option>
        <option>Comportamiento sospechoso</option>
        <option>Otro</option>
      </select>
      <label>Descripción</label>
      <textarea id="description" placeholder="Describe hechos concretos y verificables..."></textarea>
      <button class="green" onclick="saveReport()">GUARDAR REPORTE</button>
      <div id="reportMsg"></div>
    </section>

    <section class="card">
      <div class="row">
        <button class="dark" onclick="loadHistory()">📋 HISTORIAL</button>
        <button class="dark" onclick="linkContact()">🔗 VINCULAR NÚMERO + @USUARIO</button>
      </div>
      <div id="history"></div>
      <div id="linkMsg"></div>
    </section>
  </main>
</div>

<script>
/*
  VERIFICACION LOVAG
  IMPORTANTE:
  - Usa SOLO la publishable key en el navegador.
  - NO pongas la secret/service_role key aquí.
  - Antes de publicar, cambia SUPABASE_URL por la URL de tu proyecto.
*/
const SUPABASE_URL = "https://aaakmoylfzkadlyzbs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_K4-hEsNRtAB7SQ8Jo4zQkA_NaZNGUWx";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});
let currentUser = null;
let currentProfile = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));

function msg(id, text, ok=false){
  $(id).innerHTML = `<div class="${ok?'success':'error'}">${esc(text)}</div>`;
}

async function login(){
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if(!email || !password)
    return msg("loginMsg","Escribe correo y contraseña.");

  $("loginMsg").innerHTML="";

  try{
    if(!window.supabase || typeof supabase.createClient !== "function"){
      return msg("loginMsg","No se pudo cargar Supabase. Recarga la página.");
    }

    const {data,error} = await db.auth.signInWithPassword({email,password});

    if(error){
      console.error("Supabase Auth:", error);
      const m = (error.message || "").toLowerCase();

      if(m.includes("invalid login credentials") || m.includes("invalid credentials"))
        return msg("loginMsg","Correo o contraseña incorrectos.");

      if(m.includes("email not confirmed"))
        return msg("loginMsg","El correo todavía no está confirmado en Supabase.");

      if(m.includes("failed to fetch") || m.includes("network"))
        return msg("loginMsg","No se pudo conectar con Supabase. Revisa la conexión y la URL del proyecto.");

      return msg("loginMsg", error.message || "No fue posible iniciar sesión.");
    }

    if(!data?.user)
      return msg("loginMsg","Supabase no devolvió un usuario.");

    currentUser = data.user;
    await loadProfile();

    $("loginCard").classList.add("hidden");
    $("mainApp").classList.remove("hidden");
    $("loginMsg").innerHTML="";
  }catch(e){
    console.error("Login:",e);
    msg("loginMsg", e?.message || "Error de conexión con Supabase.");
  }
}

async function logout(){
  await db.auth.signOut();
  currentUser=null; currentProfile=null;
  $("mainApp").classList.add("hidden");
  $("loginCard").classList.remove("hidden");
}

async function loadProfile(){
  const {data,error} = await db.from("profiles")
    .select("id,full_name,username,role,active,must_change_password")
    .eq("id",currentUser.id).maybeSingle();

  if(error){ console.error(error); return; }
  currentProfile=data;
  $("sessionText").textContent = "Sesión: " + (data?.full_name || data?.username || currentUser.email);
  $("roleBadge").textContent = data?.role || "Empleado";
}

function normalizePhone(v){
  return v.replace(/[^\d+]/g,"").trim();
}
function normalizeUsername(v){
  v=v.trim();
  if(!v) return "";
  return v.startsWith("@") ? v : "@"+v;
}

async function findContacts(phone, username){
  let query = db.from("contacts").select("id,phone,wa_username,display_name,created_at,updated_at");
  const conditions=[];
  if(phone) conditions.push(`phone.eq.${phone}`);
  if(username) conditions.push(`wa_username.eq.${username}`);
  if(!conditions.length) return {data:[],error:null};
  query=query.or(conditions.join(","));
  return await query.order("created_at",{ascending:false});
}

async function searchContact(){
  const phone=normalizePhone($("searchPhone").value);
  const username=normalizeUsername($("searchUsername").value);
  if(!phone && !username) return msg("searchResult","Escribe un número o un @usuario.");

  const {data,error}=await findContacts(phone,username);
  if(error) return msg("searchResult",error.message);

  if(!data?.length){
    $("searchResult").innerHTML='<div class="result danger"><strong>⚠️ Sin registros</strong><div class="muted">No encontramos reportes/contactos asociados.</div></div>';
    return;
  }

  let html="";
  for(const c of data){
    const {data:reports}=await db.from("reports")
      .select("id,reason,description,status,created_at,created_by")
      .eq("contact_id",c.id).order("created_at",{ascending:false});
    html+=`<div class="result">
      <strong>⚠️ ${esc(c.display_name || "Contacto registrado")}</strong>
      <div>Número: ${esc(c.phone || "—")}</div>
      <div>Usuario: ${esc(c.wa_username || "—")}</div>
      <div class="linkbox"><strong>Reportes: ${reports?.length || 0}</strong>
      ${(reports||[]).map(r=>`<div class="report"><strong>${esc(r.reason)}</strong>
      <div>${esc(r.description)}</div><div class="muted">${new Date(r.created_at).toLocaleString()}</div></div>`).join("")}
      </div></div>`;
  }
  $("searchResult").innerHTML=html;
}

async function getOrCreateContact(phone, username){
  phone=normalizePhone(phone);
  username=normalizeUsername(username);
  if(!phone && !username) throw new Error("Debes indicar número o @usuario.");

  let found=null;
  if(phone){
    const {data,error}=await db.from("contacts").select("*").eq("phone",phone).maybeSingle();
    if(error && error.code!=="PGRST116") throw error;
    found=data;
  }
  if(!found && username){
    const {data,error}=await db.from("contacts").select("*").eq("wa_username",username).maybeSingle();
    if(error && error.code!=="PGRST116") throw error;
    found=data;
  }
  if(found) return found;

  const {data,error}=await db.from("contacts").insert({
    phone: phone || null,
    wa_username: username || null
  }).select().single();
  if(error) throw error;
  return data;
}

async function saveReport(){
  try{
    const phone=normalizePhone($("reportPhone").value);
    const username=normalizeUsername($("reportUsername").value);
    const reason=$("reason").value;
    const description=$("description").value.trim();

    if(!phone && !username) return msg("reportMsg","Indica número o @usuario.");
    if(!description) return msg("reportMsg","Describe los hechos concretos.");

    const contact=await getOrCreateContact(phone,username);
    const {error}=await db.from("reports").insert({
      contact_id:contact.id,
      reason,
      description,
      status:"pending",
      created_by:currentUser.id
    });
    if(error) throw error;

    $("reportPhone").value="";
    $("reportUsername").value="";
    $("description").value="";
    msg("reportMsg","Reporte guardado correctamente.",true);
  }catch(e){
    console.error(e);
    msg("reportMsg",e.message || "No fue posible guardar el reporte.");
  }
}

async function linkContact(){
  try{
    const phone=normalizePhone($("reportPhone").value || $("searchPhone").value);
    const username=normalizeUsername($("reportUsername").value || $("searchUsername").value);
    if(!phone || !username) return msg("linkMsg","Para vincular debes indicar número y @usuario.");

    const contact=await getOrCreateContact(phone,username);
    const {error}=await db.from("contacts").update({
      phone, wa_username:username, updated_at:new Date().toISOString()
    }).eq("id",contact.id);
    if(error) throw error;
    msg("linkMsg","Número y @usuario vinculados correctamente.",true);
  }catch(e){ msg("linkMsg",e.message || "No fue posible vincular."); }
}

async function loadHistory(){
  const {data,error}=await db.from("reports")
    .select("id,contact_id,reason,description,status,created_at,created_by,contacts(phone,wa_username,display_name)")
    .order("created_at",{ascending:false}).limit(50);

  if(error) return msg("history",error.message);
  if(!data?.length){
    $("history").innerHTML='<p class="muted center">No hay reportes todavía.</p>';
    return;
  }
  $("history").innerHTML=data.map(r=>`
    <div class="report">
      <strong>${esc(r.reason)}</strong>
      <div>${esc(r.contacts?.display_name || "Contacto")}</div>
      <div class="small">📱 ${esc(r.contacts?.phone || "—")} &nbsp; ${esc(r.contacts?.wa_username || "—")}</div>
      <div>${esc(r.description)}</div>
      <div class="muted">${new Date(r.created_at).toLocaleString()} · ${esc(r.status || "pending")}</div>
    </div>`).join("");
}

async function init(){
  const {data}=await db.auth.getSession();
  if(data.session){
    currentUser=data.session.user;
    await loadProfile();
    $("loginCard").classList.add("hidden");
    $("mainApp").classList.remove("hidden");
  }
}
init();
</script>
</body>
</html>
